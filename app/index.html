<!doctype html>
<html><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<meta name="theme-color" content="#000000">
<title>N64</title>
<link rel="stylesheet" href="style.css?v=1.3.2">
</head><body>

<!-- No editable element on purpose. While a text field holds focus the KaiOS
     keyboard app owns the dialer keys: it inserts IME text ("a", "d", ".") over
     the game and swallows arrow keys. ompterm's working game mode has no
     focused field either; plain keydown/keyup on the window deliver every key
     (n64.log confirms menu keys arrive with activeElement == body). -->

<div id="menu">
  <div id="mtitle">N64<span id="mver"></span></div>
  <div id="mhint">OK play &#183; &#42; reload &#183; Back exit</div>
  <div id="mlist"></div>
</div>

<div id="game">
  <canvas id="gc" width="240" height="320"></canvas>
  <div id="gstat">&#8230;</div>
</div>

<!-- In-game save/load menu (SoftRight over the running game): page 1 = the
     two sections, page 2 = that section's five slots (n64.js draws both).
     Like the ROM list this is buttons only: no editable element. -->
<div id="ovl">
  <div id="otitle">MENU</div>
  <div id="ohint">OK select &#183; Back resume</div>
  <div id="olist"></div>
  <div id="ostat"></div>
</div>

<script src="n64.js?v=1.3.2"></script>
</body></html>
